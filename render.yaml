# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: styleguru
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      # The key is never stored in this repository; Render asks for it when the service is created.
      - key: GEMINI_API_KEY
        sync: false
